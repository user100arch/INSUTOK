<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>INSUTOK — Income Interruption Insurance for Content Creators</title>
<meta name="description" content="The first actuarially-priced income interruption insurance for Kenyan content creators on TikTok, YouTube, and Instagram."/>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg: #0a0c10;
  --surface: #13161e;
  --surface2: #1a1e2a;
  --surface3: #212636;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #e8eaf2;
  --muted: #6e7899;
  --accent: #f59e0b;
  --accent-glow: rgba(245,158,11,0.18);
  --accent2: #3b82f6;
  --accent3: #10b981;
  --danger: #ef4444;
  --whatsapp: #25D366;
  --card-radius: 18px;
  --t: 0.22s cubic-bezier(0.4,0,0.2,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:16px;line-height:1.65;
  overflow-x:hidden;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:3px;}

/* ── NAV ── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  background:rgba(10,12,16,0.88);backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 48px;height:66px;transition:all var(--t);
}
.nav-logo{
  font-family:'Syne',sans-serif;font-weight:800;font-size:22px;
  letter-spacing:-0.5px;color:var(--accent);text-decoration:none;
}
.nav-logo span{color:var(--text);}
.nav-links{display:flex;gap:28px;list-style:none;}
.nav-links a{
  color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;
  letter-spacing:0.02em;transition:all var(--t);
  padding: 22px 0; 
  border-bottom: 2px solid transparent;
}
.nav-links a:hover{color:var(--text);}
.nav-links a.active{color: var(--accent);border-bottom: 2px solid var(--accent);}
.nav-actions{display:flex;gap:10px;align-items:center;}
.nav-cta{
  background:var(--accent);color:#000;border:none;
  padding:9px 20px;border-radius:100px;
  font-family:'DM Sans',sans-serif;font-weight:600;font-size:13px;cursor:pointer;
  transition:all var(--t);
}
.nav-cta:hover{background:#fbbf24;transform:translateY(-1px);box-shadow:0 8px 24px var(--accent-glow);}
.nav-wa{
  background:var(--whatsapp);color:#fff;border:none;
  padding:9px 16px;border-radius:100px;
  font-family:'DM Sans',sans-serif;font-weight:500;font-size:13px;cursor:pointer;
  transition:all var(--t);text-decoration:none;display:flex;align-items:center;gap:6px;
}
.nav-wa:hover{background:#1ebe5d;transform:translateY(-1px);}

/* ── TABS ── */
.tab-content { display: none; animation: tabFadeIn 0.5s cubic-bezier(0.4,0,0.2,1) forwards; }
.tab-content.active { display: block; }
@keyframes tabFadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

/* ── HERO ── */
.hero{
  min-height:100vh;display:flex;flex-direction:column;
  justify-content:center;align-items:center;text-align:center;
  padding:120px 24px 80px;position:relative;overflow:hidden;
}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.22);
  color:var(--accent);border-radius:100px;padding:7px 18px;
  font-size:13px;font-weight:500;margin-bottom:36px;letter-spacing:0.04em;
}
.pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(0.85);}}

.hero h1{
  font-family:'Syne',sans-serif;font-size:clamp(44px,7vw,88px);
  font-weight:800;line-height:1.0;letter-spacing:-2.5px;
  margin-bottom:28px;max-width:920px;
}
.hero h1 .highlight{
  color:transparent;
  background:linear-gradient(135deg,#f59e0b 0%,#f97316 50%,#ef4444 100%);
  -webkit-background-clip:text;background-clip:text;display:inline-block;
}
.hero-sub{font-size:18px;color:var(--muted);max-width:560px;margin:0 auto 52px;line-height:1.75;font-weight:300;}
.hero-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:56px;}

.btn-primary{
  background:var(--accent);color:#000;border:none;
  padding:16px 36px;border-radius:100px;
  font-family:'DM Sans',sans-serif;font-weight:600;font-size:15px;cursor:pointer;
  transition:all var(--t);text-decoration:none;display:inline-flex;align-items:center;gap:8px;
}
.btn-primary:hover{background:#fbbf24;transform:translateY(-2px);box-shadow:0 16px 40px rgba(245,158,11,0.3);}
.btn-ghost{
  background:transparent;color:var(--text);border:1px solid var(--border2);
  padding:16px 36px;border-radius:100px;
  font-family:'DM Sans',sans-serif;font-weight:500;font-size:15px;cursor:pointer;
  transition:all var(--t);text-decoration:none;display:inline-flex;align-items:center;gap:8px;
}
.btn-ghost:hover{background:var(--surface);border-color:rgba(255,255,255,0.2);}
.btn-whatsapp{
  background:var(--whatsapp);color:#fff;border:none;
  padding:16px 32px;border-radius:100px;
  font-family:'DM Sans',sans-serif;font-weight:600;font-size:15px;cursor:pointer;
  transition:all var(--t);text-decoration:none;display:inline-flex;align-items:center;gap:8px;
}
.btn-whatsapp:hover{background:#1ebe5d;transform:translateY(-2px);box-shadow:0 16px 40px rgba(37,211,102,0.3);}

.trust-strip{display:flex;gap:32px;flex-wrap:wrap;justify-content:center;align-items:center;opacity:0.55;}
.trust-item{font-size:12px;letter-spacing:0.06em;text-transform:uppercase;font-weight:500;}

.hero::before{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,0.035) 1px, transparent 0);
  background-size:52px 52px;pointer-events:none;
}
.hero-glow{
  position:absolute;width:900px;height:900px;border-radius:50%;
  background:radial-gradient(circle,rgba(245,158,11,0.07),transparent 65%);
  top:50%;left:50%;transform:translate(-50%,-55%);pointer-events:none;animation:glowPulse 6s ease-in-out infinite;
}
@keyframes glowPulse{0%,100%{opacity:1;}50%{opacity:0.6;}}

/* ── COMMON SECTIONS ── */
.section-wrap{padding:110px 48px;max-width:1240px;margin:0 auto;}
.section-tag{
  display:inline-block;font-size:11px;font-weight:600;letter-spacing:0.12em;
  text-transform:uppercase;color:var(--accent);margin-bottom:18px;
  background:var(--accent-glow);padding:5px 12px;border-radius:100px;
}
.section-title{
  font-family:'Syne',sans-serif;font-size:clamp(34px,4vw,54px);
  font-weight:700;letter-spacing:-1.5px;margin-bottom:16px;line-height:1.08;
}
.section-sub{font-size:17px;color:var(--muted);max-width:560px;line-height:1.75;}
.tab-padding-top { padding-top: 100px; }

/* ── CHARTS SPECIFIC ── */
.chart-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 32px;
  margin-top: 40px;
}
.chart-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--card-radius);
  padding: 32px;
  position: relative;
}
.chart-card h3 {
  font-family: 'Syne', sans-serif;
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 8px;
}
.chart-card p {
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 24px;
}
.chart-container {
  position: relative;
  height: 300px;
  width: 100%;
  background: var(--surface);
  border-radius: 8px;
}

/* ── COMPONENTS ── */
.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--surface);}
.stat-item{padding:44px 32px;text-align:center;border-right:1px solid var(--border);transition:background var(--t);}
.stat-item:last-child{border-right:none;}
.stat-item:hover{background:var(--surface2);}
.stat-num{font-family:'Syne',sans-serif;font-size:52px;font-weight:800;letter-spacing:-2px;display:block;color:var(--accent);line-height:1;}
.stat-label{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.4;}

.problem-grid,.features-grid,.tiers-grid,.method-grid{display:grid;gap:22px;margin-top:64px;}
.problem-grid,.features-grid,.tiers-grid{grid-template-columns:repeat(3,1fr);}
.method-grid{grid-template-columns:1fr 1fr;}

.p-card,.feat-card,.method-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--card-radius);padding:34px;position:relative;overflow:hidden;transition:all var(--t);}
.p-card:hover,.feat-card:hover{transform:translateY(-3px);box-shadow:0 20px 60px rgba(0,0,0,0.3);border-color:var(--border2);}
.p-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.p-card.c1::before{background:linear-gradient(90deg,#f59e0b,#f97316);}
.p-card.c2::before{background:linear-gradient(90deg,#ef4444,#ec4899);}
.p-card.c3::before{background:linear-gradient(90deg,#3b82f6,#6366f1);}
.p-card.c4::before{background:linear-gradient(90deg,#10b981,#06b6d4);}
.p-card.c5::before{background:linear-gradient(90deg,#8b5cf6,#ec4899);}
.p-card.c6::before{background:linear-gradient(90deg,#f59e0b,#10b981);}
.p-icon{font-size:34px;margin-bottom:18px;display:block;}
.feat-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:22px;}
.p-card h3,.feat-card h3,.method-card h3{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:10px;}
.p-card p,.feat-card p{font-size:14px;color:var(--muted);line-height:1.65;}
.formula{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:20px 24px;font-family:'DM Mono',monospace;font-size:13px;color:var(--accent);line-height:1.9;margin:18px 0;}

/* ── CALCULATOR ── */
.calc-wrap{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:60px;}
.calc-grid{display:grid;grid-template-columns:1fr 420px;gap:56px;align-items:start;}
.calc-inputs{display:flex;flex-direction:column;gap:30px;}
.input-label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:10px;}
.input-row{display:flex;align-items:center;gap:14px;}
input[type=range]{flex:1;-webkit-appearance:none;height:4px;background:linear-gradient(90deg,var(--accent) var(--pct,50%),var(--border2) var(--pct,50%));border-radius:2px;outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 0 5px rgba(245,158,11,0.18);transition:box-shadow var(--t);}
input[type=range]::-webkit-slider-thumb:hover{box-shadow:0 0 0 8px rgba(245,158,11,0.25);}
.range-val{font-family:'DM Mono',monospace;font-size:14px;color:var(--accent);min-width:90px;text-align:right;font-weight:500;}

.calc-result{background:var(--bg);border:1px solid var(--border);border-radius:18px;padding:44px 36px;position:sticky;top:84px;}
.big-premium{font-family:'Syne',sans-serif;font-size:48px;font-weight:800;color:var(--accent);letter-spacing:-2px;line-height:1;margin-bottom:4px;}
.big-period{font-size:14px;color:var(--muted);margin-bottom:8px;}
.monthly-equiv{font-size:13px;color:var(--accent3);background:rgba(16,185,129,0.1);border-radius:6px;padding:4px 10px;display:inline-block;margin-bottom:28px;}
.breakdown-title{font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;}
.br-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
.br-row:last-child{border-bottom:none;color:var(--accent);font-weight:600;}
.br-row span:first-child{color:var(--muted);}
.calc-actions{margin-top:24px;display:flex;flex-direction:column;gap:10px;}

/* ── RESTORED BEAUTIFUL TIER STYLES ── */
.tier{
  border-radius:var(--card-radius);padding:36px;
  border:1px solid var(--border);position:relative;overflow:hidden;
  transition:all var(--t);background:var(--surface);
}
.tier:hover{transform:translateY(-4px);box-shadow:0 24px 60px rgba(0,0,0,0.3);}
.tier-tag{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;font-weight:700;margin-bottom:10px;}
.tier h3{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;margin-bottom:4px;}
.tier-price{font-size:14px;color:var(--muted);margin-bottom:28px;}
.tier ul{list-style:none;display:flex;flex-direction:column;gap:11px;}
.tier li{font-size:14px;display:flex;align-items:flex-start;gap:10px;line-height:1.4;}
.tier-check{font-size:12px;font-weight:700;margin-top:1px;flex-shrink:0;}
.tier-cta{
  width:100%;margin-top:28px;padding:13px;border-radius:12px;
  font-family:'DM Sans',sans-serif;font-weight:600;font-size:14px;cursor:pointer;
  transition:all var(--t);border:none;
}

.tier.bronze{background:linear-gradient(160deg,rgba(205,127,50,0.06),var(--surface));}
.tier.bronze .tier-tag,.tier.bronze .tier-check{color:#cd7f32;}
.tier.bronze .tier-cta{background:rgba(205,127,50,0.12);color:#cd7f32;}
.tier.bronze .tier-cta:hover{background:rgba(205,127,50,0.22);}

.tier.silver{background:linear-gradient(160deg,rgba(160,160,200,0.08),var(--surface));border-color:var(--border2);}
.tier.silver .tier-tag,.tier.silver .tier-check{color:#a0a0c0;}
.tier.silver .tier-cta{background:rgba(160,160,200,0.12);color:#a0a0c0;}
.tier.silver .tier-cta:hover{background:rgba(160,160,200,0.22);}

.tier.gold{background:linear-gradient(160deg,rgba(245,158,11,0.12),var(--surface));border-color:rgba(245,158,11,0.28);}
.tier.gold .tier-tag,.tier.gold .tier-check{color:var(--accent);}
.tier.gold .tier-cta{background:var(--accent);color:#000;}
.tier.gold .tier-cta:hover{background:#fbbf24;}
.tier.gold::after{
  content:'RECOMMENDED';position:absolute;top:20px;right:-28px;
  background:var(--accent);color:#000;font-size:9px;font-weight:700;
  letter-spacing:0.1em;padding:5px 40px;transform:rotate(35deg);
}

/* ── FORMS & INPUTS ── */
select, input[type=text], input[type=email], input[type=tel], input[type=date], input[type=number], textarea{
  width:100%;background:var(--bg);border:1px solid var(--border2);
  color:var(--text);padding:14px 18px;border-radius:12px;
  font-family:'DM Sans',sans-serif;font-size:15px;outline:none;transition:border-color var(--t);
}
select:focus, input:focus, textarea:focus{border-color:var(--accent);}
textarea{resize:vertical;min-height:110px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:28px;}
.form-field{display:flex;flex-direction:column;gap:8px;}
.form-field.full{grid-column:1/-1;}
.form-field label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;}
.claim-form-wrap{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:60px;}

/* ── TIMELINE ── */
.timeline{position:relative;margin-top:64px;padding-left:40px;}
.timeline::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:1px;background:linear-gradient(to bottom,var(--accent),transparent);}
.tl-item{position:relative;margin-bottom:52px;}
.tl-item:last-child{margin-bottom:0;}
.tl-dot{position:absolute;left:-47px;top:4px;width:15px;height:15px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);box-shadow:0 0 0 2px var(--accent),0 0 20px var(--accent-glow);}
.tl-step{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:8px;}
.tl-item h3{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;margin-bottom:8px;}
.tl-item p{font-size:15px;color:var(--muted);max-width:580px;line-height:1.65;}

/* ── CONTACT & FAQ ── */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;margin-top:64px;align-items:start;}
.contact-info h3{font-family:'Syne',sans-serif;font-size:28px;font-weight:700;margin-bottom:16px;}
.contact-info p{color:var(--muted);font-size:15px;line-height:1.7;margin-bottom:32px;}
.contact-methods{display:flex;flex-direction:column;gap:14px;}
.contact-btn{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:14px;text-decoration:none;border:1px solid var(--border);background:var(--surface);transition:all var(--t);cursor:pointer;}
.contact-btn:hover{border-color:var(--border2);background:var(--surface2);transform:translateX(4px);}
.contact-btn-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.contact-btn-text strong{display:block;font-size:14px;font-weight:600;}
.contact-btn-text span{font-size:12px;color:var(--muted);}

.faq-list{margin-top:64px;display:flex;flex-direction:column;gap:14px;}
.faq-item{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.faq-q{width:100%;display:flex;align-items:center;justify-content:space-between;padding:22px 28px;background:none;border:none;color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px;font-weight:500;cursor:pointer;text-align:left;transition:background var(--t);}
.faq-q:hover{background:var(--surface2);}
.faq-chevron{transition:transform 0.3s;color:var(--muted);font-size:18px;flex-shrink:0;}
.faq-item.open .faq-chevron{transform:rotate(180deg);}
.faq-a{max-height:0;overflow:hidden;transition:max-height 0.4s cubic-bezier(0.4,0,0.2,1);font-size:15px;color:var(--muted);line-height:1.7;}
.faq-item.open .faq-a{max-height:300px;}
.faq-a-inner{padding:0 28px 22px;}

/* ── MODALS & TOAST ── */
.toast{position:fixed;bottom:28px;right:28px;z-index:1000;background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:16px 24px;display:flex;align-items:center;gap:12px;transform:translateY(90px);opacity:0;transition:all 0.4s;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;pointer-events:all;}

.modal-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:24px;padding:52px;max-width:500px;width:90%;transform:translateY(20px) scale(0.97);transition:transform 0.3s;position:relative;}
.modal-overlay.open .modal{transform:translateY(0) scale(1);}
.modal h2{font-family:'Syne',sans-serif;font-size:28px;font-weight:700;margin-bottom:10px;}
.modal p{color:var(--muted);font-size:15px;margin-bottom:28px;line-height:1.6;}
.modal-close{position:absolute;top:16px;right:20px;background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;}
.modal-field{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.modal-field label{font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);}

/* ── FOOTER ── */
footer{border-top:1px solid var(--border);padding:56px 48px;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:48px;}
.footer-brand .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;color:var(--accent);}
.footer-brand .logo span{color:var(--text);}
.footer-brand p{font-size:13px;color:var(--muted);margin-top:8px;max-width:260px;line-height:1.6;}
.footer-links{display:flex;flex-direction:column;gap:14px;align-items:center;}
.footer-links a{color:var(--muted);text-decoration:none;font-size:14px;transition:color var(--t);}
.footer-links a:hover{color:var(--text);}
.footer-right{text-align:right;}
.footer-right p{font-size:12px;color:var(--muted);line-height:1.7;}
.footer-social{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}
.social-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:16px;text-decoration:none;transition:all var(--t);}
.social-btn:hover{background:var(--surface2);border-color:var(--border2);transform:translateY(-2px);}

.fab-wa{position:fixed;bottom:28px;left:28px;z-index:400;background:var(--whatsapp);color:#fff;border:none;width:56px;height:56px;border-radius:50%;font-size:28px;cursor:pointer;box-shadow:0 8px 32px rgba(37,211,102,0.4);transition:all var(--t);display:flex;align-items:center;justify-content:center;text-decoration:none;animation:waFloat 3s ease-in-out infinite;}
.fab-wa:hover{background:#1ebe5d;transform:scale(1.1);box-shadow:0 12px 40px rgba(37,211,102,0.5);}
@keyframes waFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}

.fade-in{opacity:0;transform:translateY(28px);transition:opacity 0.65s,transform 0.65s;}
.fade-in.visible{opacity:1;transform:translateY(0);}

/* ── PDF REPORT TEMPLATE ── */
#pdf-report-container {

/* ── RISK PROFILER ── */
.risk-profiler-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;}
.risk-factor-card{
  background:var(--bg);border:1px solid var(--border);
  border-radius:var(--card-radius);padding:36px;
  transition:border-color var(--t);
}
.risk-factor-card:hover{border-color:var(--border2);}
.risk-factor-header{display:flex;align-items:center;gap:16px;margin-bottom:14px;}
.risk-factor-num{
  font-family:'Syne',sans-serif;font-size:32px;font-weight:800;
  color:var(--accent);opacity:0.3;line-height:1;flex-shrink:0;
}
.risk-factor-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;}
.risk-factor-weight{font-size:12px;color:var(--accent);background:var(--accent-glow);padding:3px 10px;border-radius:100px;display:inline-block;margin-top:4px;}
.risk-factor-desc{font-size:14px;color:var(--muted);margin-bottom:20px;line-height:1.5;}
.risk-opts{display:flex;flex-direction:column;gap:10px;}
.ropt{
  display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;
  gap:2px 12px;padding:14px 16px;border-radius:12px;
  background:var(--surface);border:1px solid var(--border);
  cursor:pointer;transition:all var(--t);text-align:left;
}
.ropt:hover{border-color:var(--border2);background:var(--surface2);}
.ropt.selected{border-color:var(--accent);background:rgba(245,158,11,0.06);}
.ropt-label{font-size:14px;font-weight:600;color:var(--text);grid-row:1;grid-column:1;}
.ropt-score{font-size:13px;font-weight:700;color:var(--accent);grid-row:1;grid-column:2;white-space:nowrap;font-family:'DM Mono',monospace;}
.ropt.selected .ropt-score{color:var(--accent);}
.ropt-desc{font-size:12px;color:var(--muted);grid-row:2;grid-column:1/3;line-height:1.4;margin-top:2px;}

.risk-result-panel{
  background:var(--surface);border:1px solid var(--border2);
  border-radius:var(--card-radius);padding:36px;
  grid-row:1/3;display:flex;flex-direction:column;
}
.rrp-header{font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.rrp-score{
  font-family:'Syne',sans-serif;font-size:72px;font-weight:800;
  letter-spacing:-3px;line-height:1;margin-bottom:20px;
  background:linear-gradient(135deg,#f59e0b,#ef4444);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.rrp-range-bar{margin-bottom:20px;}
.rrp-bar-track{
  position:relative;height:10px;border-radius:5px;
  background:linear-gradient(90deg,#ef4444,#f59e0b,#10b981);
  margin-bottom:8px;
}
.rrp-bar-marker{
  position:absolute;top:-5px;width:20px;height:20px;border-radius:50%;
  background:#fff;border:3px solid var(--accent);
  transform:translateX(-50%);transition:left 0.5s cubic-bezier(0.4,0,0.2,1);
  box-shadow:0 0 0 4px rgba(245,158,11,0.2);
}
.rrp-bar-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);}
.rrp-classification{
  font-family:'Syne',sans-serif;font-size:22px;font-weight:700;
  margin-bottom:8px;
}
.rrp-desc{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:20px;}
.rrp-math-box{
  background:var(--bg);border:1px solid var(--border);
  border-radius:10px;padding:16px;margin-bottom:20px;
}
.rrp-math-title{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.rrp-math-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border);}
.rrp-math-row:last-child{border-bottom:none;}
.rrp-math-row span:first-child{color:var(--muted);}
.rrp-math-row.total{font-weight:700;color:var(--accent);padding-top:10px;margin-top:4px;}
.rrp-math-row.total span:first-child{color:var(--accent);}
.rrp-recommendation{
  background:linear-gradient(135deg,rgba(245,158,11,0.08),transparent);
  border:1px solid rgba(245,158,11,0.2);border-radius:12px;
  padding:16px;margin-top:auto;
}
.rrp-rec-label{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.rrp-rec-plan{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;color:var(--accent);}
.rrp-rec-price{font-size:13px;color:var(--muted);margin-top:2px;}

/* ── CLAIM SECTIONS ── */
.claim-section{
  border:1px solid var(--border);border-radius:16px;padding:36px;
  margin-bottom:24px;background:var(--bg);
}
.claim-section-header{display:flex;align-items:center;gap:20px;margin-bottom:28px;}
.claim-section-num{
  font-family:'Syne',sans-serif;font-size:40px;font-weight:800;
  color:var(--accent);opacity:0.25;line-height:1;flex-shrink:0;
}
.claim-section-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;}
.claim-section-sub{font-size:13px;color:var(--muted);margin-top:3px;}

/* API CONNECT */
.api-connect-section{
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:24px;margin-top:20px;
}
.api-connect-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
.api-badge{
  font-size:11px;background:rgba(16,185,129,0.12);color:var(--accent3);
  border:1px solid rgba(16,185,129,0.2);padding:3px 10px;border-radius:100px;font-weight:500;
}
.api-connect-desc{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.5;}
.api-btns{display:flex;flex-direction:column;gap:10px;}
.api-btn{
  display:flex;align-items:center;gap:14px;padding:14px 18px;
  border-radius:12px;border:1px solid var(--border2);background:var(--bg);
  cursor:pointer;transition:all var(--t);text-align:left;
}
.api-btn:hover{border-color:var(--accent);background:rgba(245,158,11,0.04);}
.api-btn.connected{border-color:var(--accent3);background:rgba(16,185,129,0.06);}
.api-btn-icon{font-size:22px;flex-shrink:0;}
.api-btn strong{display:block;font-size:14px;color:var(--text);}
.api-btn small{font-size:12px;color:var(--muted);}
.api-status{
  margin-left:auto;font-size:11px;font-weight:600;letter-spacing:0.04em;
  color:var(--muted);background:var(--surface);padding:4px 10px;border-radius:100px;
  border:1px solid var(--border);white-space:nowrap;flex-shrink:0;
}
.api-btn.connected .api-status{color:var(--accent3);background:rgba(16,185,129,0.1);border-color:rgba(16,185,129,0.2);}

/* LEGAL CHECKBOXES */
.legal-checkboxes{display:flex;flex-direction:column;gap:14px;}
.legal-check-item{
  display:flex;gap:16px;align-items:flex-start;padding:18px;
  border:1px solid var(--border);border-radius:12px;cursor:pointer;
  transition:border-color var(--t);
}
.legal-check-item:hover{border-color:var(--border2);}
.legal-cb{
  width:20px;height:20px;margin-top:2px;flex-shrink:0;
  accent-color:var(--accent);cursor:pointer;
}
.legal-check-text strong{display:block;font-size:14px;font-weight:600;margin-bottom:4px;}
.legal-check-text span{font-size:13px;color:var(--muted);line-height:1.5;}

/* ── PDF REPORT TEMPLATE ── */
#pdf-report-container {
  display: none; /* Hidden during regular browsing */
  background: #ffffff;
  color: #1a1a1a;
  padding: 35px 45px;
  width: 760px; /* Perfect A4 scaling width */
  font-family: 'DM Sans', sans-serif;
  box-sizing: border-box;
}

#pdf-report-container .pdf-header {
  border-bottom: 3px solid #f59e0b;
  padding-bottom: 15px;
  margin-bottom: 25px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}

#pdf-report-container h1 { 
  font-family: 'Syne', sans-serif; 
  color: #f59e0b; 
  margin: 0; 
  font-size: 38px; 
  line-height: 1;
}

#pdf-report-container .pdf-meta {
  text-align: right;
  font-size: 12px;
  color: #666;
}

#pdf-report-container h2 {

  color: #111;

  margin-top: 30px; 
  margin-bottom: 15px;

  border-left: 4px solid #f59e0b;

}

.pdf-row { 
  display: flex; 
  justify-content: space-between; 
  font-size: 13px; 
  padding: 8px 0;

.pdf-row:last-child { border-bottom: none; }
.pdf-row span { color: #555; }
.pdf-row strong { color: #000; font-weight: 600; text-align: right;}

.pdf-chart-img {

  max-height: 240px;

/* ══════════════════════════════════
   AUTH SCREEN
══════════════════════════════════ */
#auth-screen{
  position:fixed;inset:0;z-index:9000;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}
.auth-card{
  background:var(--surface);border:1px solid var(--border2);
  border-radius:28px;padding:56px 52px;width:100%;max-width:480px;
  position:relative;overflow:hidden;
}
.auth-card::before{
  content:'';position:absolute;top:-80px;right:-80px;
  width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle,rgba(245,158,11,0.12),transparent 70%);
  pointer-events:none;
}
.auth-logo{
  font-family:'Syne',sans-serif;font-weight:800;font-size:28px;
  color:var(--accent);margin-bottom:8px;
}
.auth-logo span{color:var(--text);}
.auth-tagline{font-size:14px;color:var(--muted);margin-bottom:36px;line-height:1.5;}
.auth-tabs{display:flex;gap:4px;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:32px;}
.auth-tab{
  flex:1;padding:10px;border-radius:9px;border:none;
  font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;
  cursor:pointer;transition:all var(--t);color:var(--muted);background:transparent;
}
.auth-tab.active{background:var(--accent);color:#000;}
.auth-field{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
.auth-field label{font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);}
.auth-field input{
  background:var(--bg);border:1px solid var(--border2);
  color:var(--text);padding:14px 18px;border-radius:12px;
  font-family:'DM Sans',sans-serif;font-size:15px;outline:none;
  transition:border-color var(--t);width:100%;
}
.auth-field input:focus{border-color:var(--accent);}
.auth-btn{
  width:100%;padding:16px;border-radius:14px;border:none;
  background:var(--accent);color:#000;
  font-family:'DM Sans',sans-serif;font-weight:700;font-size:15px;
  cursor:pointer;transition:all var(--t);margin-top:8px;
}
.auth-btn:hover{background:#fbbf24;transform:translateY(-1px);box-shadow:0 8px 24px rgba(245,158,11,0.3);}
.auth-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.auth-divider{text-align:center;font-size:13px;color:var(--muted);margin:16px 0;}
.auth-forgot{
  display:block;text-align:right;font-size:13px;color:var(--accent);
  text-decoration:none;margin-top:-10px;margin-bottom:18px;cursor:pointer;
}
.auth-forgot:hover{text-decoration:underline;}
.auth-error{
  background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);
  color:#ef4444;border-radius:10px;padding:12px 16px;
  font-size:13px;margin-bottom:16px;display:none;line-height:1.4;
}
.auth-success-msg{
  background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.25);
  color:var(--accent3);border-radius:10px;padding:12px 16px;
  font-size:13px;margin-bottom:16px;display:none;line-height:1.4;
}
.auth-footer-note{font-size:12px;color:var(--muted);text-align:center;margin-top:20px;line-height:1.5;}
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:48px;}
.pw-toggle{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;font-size:18px;color:var(--muted);
}
.strength-bar{height:4px;border-radius:2px;margin-top:6px;background:var(--border);overflow:hidden;}
.strength-fill{height:100%;border-radius:2px;transition:all 0.3s;width:0;}

/* ══════════════════════════════════
   NAV — LOGGED IN STATE
══════════════════════════════════ */
.nav-user-pill{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--border2);
  border-radius:100px;padding:6px 16px 6px 6px;cursor:pointer;
  transition:all var(--t);
}
.nav-user-pill:hover{border-color:var(--accent);}
.nav-avatar{
  width:30px;height:30px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),#ef4444);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;color:#000;flex-shrink:0;
}
.nav-user-name{font-size:13px;font-weight:600;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nav-dropdown{
  position:absolute;top:calc(100% + 8px);right:0;
  background:var(--surface);border:1px solid var(--border2);
  border-radius:16px;padding:8px;min-width:200px;
  box-shadow:0 20px 60px rgba(0,0,0,0.4);
  opacity:0;pointer-events:none;transform:translateY(-8px);
  transition:all 0.2s;z-index:300;
}
.nav-dropdown.open{opacity:1;pointer-events:all;transform:translateY(0);}
.nav-drop-item{
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  border-radius:10px;font-size:14px;cursor:pointer;
  transition:background var(--t);color:var(--text);text-decoration:none;
  border:none;background:none;width:100%;text-align:left;
}
.nav-drop-item:hover{background:var(--surface2);}
.nav-drop-item.danger{color:var(--danger);}
.nav-drop-item.danger:hover{background:rgba(239,68,68,0.08);}
.nav-drop-divider{height:1px;background:var(--border);margin:4px 0;}
.nav-user-wrap{position:relative;}

/* ══════════════════════════════════
   CREATOR DASHBOARD (tab-portal)
══════════════════════════════════ */
.portal-header{
  background:linear-gradient(135deg,var(--surface) 0%,var(--surface2) 100%);
  border-bottom:1px solid var(--border);padding:80px 48px 48px;
}
.portal-header-inner{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:28px;flex-wrap:wrap;}
.portal-big-avatar{
  width:80px;height:80px;border-radius:24px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),#ef4444);
  display:flex;align-items:center;justify-content:center;
  font-family:'Syne',sans-serif;font-weight:800;font-size:32px;color:#000;
  box-shadow:0 12px 40px rgba(245,158,11,0.3);
}
.portal-welcome h1{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;letter-spacing:-0.5px;}
.portal-welcome p{font-size:14px;color:var(--muted);margin-top:4px;}
.portal-status-pill{
  margin-left:auto;display:flex;align-items:center;gap:8px;
  background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.2);
  color:var(--accent3);border-radius:100px;padding:8px 18px;font-size:13px;font-weight:600;
}

.portal-grid{display:grid;grid-template-columns:320px 1fr;gap:28px;max-width:1240px;margin:0 auto;padding:40px 48px;}
.portal-sidebar{display:flex;flex-direction:column;gap:20px;}

/* Sidebar cards */
.p-card-box{
  background:var(--surface);border:1px solid var(--border);
  border-radius:18px;padding:24px;
}
.p-card-box-title{font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:16px;}
.profile-field-row{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-bottom:1px solid var(--border);}
.profile-field-row:last-child{border-bottom:none;}
.profile-field-label{font-size:11px;color:var(--muted);font-weight:500;}
.profile-field-val{font-size:14px;font-weight:600;color:var(--text);}
.profile-field-val.accent{color:var(--accent);}
.profile-field-val.green{color:var(--accent3);}
.profile-field-val.red{color:var(--danger);}

/* Risk gauge */
.risk-gauge-wrap{text-align:center;padding:8px 0;}
.risk-gauge-num{font-family:'Syne',sans-serif;font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1;}
.risk-gauge-label{font-size:14px;font-weight:600;margin-top:4px;}
.risk-gauge-bar{height:10px;border-radius:5px;background:linear-gradient(90deg,#ef4444,#f59e0b,#10b981);margin:14px 0 8px;position:relative;}
.risk-gauge-marker{position:absolute;top:-4px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--accent);transform:translateX(-50%);}

/* Main portal area */
.portal-main{display:flex;flex-direction:column;gap:20px;}
.portal-section-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:4px;}
.portal-section-sub{font-size:13px;color:var(--muted);margin-bottom:20px;}

/* Profile edit form */
.profile-edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.profile-edit-grid .full{grid-column:1/-1;}
.profile-form-field{display:flex;flex-direction:column;gap:6px;}
.profile-form-field label{font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);}
.profile-form-field input,.profile-form-field select,.profile-form-field textarea{
  background:var(--bg);border:1px solid var(--border2);
  color:var(--text);padding:12px 16px;border-radius:10px;
  font-family:'DM Sans',sans-serif;font-size:14px;outline:none;
  transition:border-color var(--t);width:100%;
}
.profile-form-field input:focus,.profile-form-field select:focus{border-color:var(--accent);}
.save-btn{
  background:var(--accent);color:#000;border:none;
  padding:13px 28px;border-radius:100px;
  font-family:'DM Sans',sans-serif;font-weight:700;font-size:14px;cursor:pointer;
  transition:all var(--t);display:inline-flex;align-items:center;gap:8px;
}
.save-btn:hover{background:#fbbf24;transform:translateY(-1px);}
.save-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

/* Policy overview */
.policy-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.policy-card{
  background:var(--bg);border:1px solid var(--border);
  border-radius:14px;padding:20px;text-align:center;
}
.policy-card-num{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:var(--accent);line-height:1;margin-bottom:4px;}
.policy-card-label{font-size:12px;color:var(--muted);}

/* Claims history */
.claims-history{display:flex;flex-direction:column;gap:10px;}
.claim-history-item{
  display:flex;align-items:center;gap:16px;padding:16px 20px;
  background:var(--bg);border:1px solid var(--border);border-radius:12px;
}
.claim-hist-ref{font-family:'DM Mono',monospace;font-size:13px;color:var(--accent);font-weight:600;}
.claim-hist-type{font-size:14px;font-weight:500;}
.claim-hist-date{font-size:12px;color:var(--muted);margin-left:auto;}
.claim-hist-status{
  font-size:11px;font-weight:700;letter-spacing:0.06em;
  padding:4px 10px;border-radius:100px;
}
.status-pending{background:rgba(245,158,11,0.1);color:var(--accent);}
.status-approved{background:rgba(16,185,129,0.1);color:var(--accent3);}
.status-review{background:rgba(59,130,246,0.1);color:var(--accent2);}
.no-claims-empty{
  text-align:center;padding:40px;color:var(--muted);
  font-size:15px;border:1px dashed var(--border2);border-radius:14px;
}

  <section id="methodology" style="background:var(--surface);border-top:1px solid var(--border);">
  <div class="section-wrap">
    <div class="fade-in">
      <span class="section-tag">Actuarial Science</span>
      <h2 class="section-title">The Math Behind<br/>Fair Pricing</h2>
      <p class="section-sub">Built on peer-reviewed actuarial models adapted for the realities of digital creator income in Kenya.</p>
    </div>
    <div class="method-grid fade-in">
      <div class="method-card">
        <h3>📊 Claim Frequency Model</h3>
        <p>Interruptions per year follow a <strong>Poisson distribution</strong> — ideal for counting rare, independent events over time.</p>
        <div class="formula">P(N=k) = λ<sup>k</sup> · e<sup>-λ</sup> / k!<br/><span class="c">// λ = avg. interruptions/year ≈ 2.0</span></div>
        <p style="font-size:14px;color:var(--muted);">Survey data from Kenyan creators shows an average of λ = 2.0 interruptions per year, varying by platform and audience size.</p>
      </div>
      <div class="method-card">
        <h3>📈 Claim Severity Model</h3>
        <p>Monetary loss per interruption follows a <strong>Lognormal distribution</strong> — suited to right-skewed income with a zero lower bound.</p>
        <div class="formula">X' = I × R × D<br/><span class="c">// I=income, R=ratio, D=days</span><br/>f(x) = 1/(x'σ√2π)·exp[−(lnx'−μ)²/2σ²]</div>
        <p style="font-size:14px;color:var(--muted);">X' captures the actual monetary loss incorporating both the income replacement ratio and interruption duration.</p>
      </div>
      <div class="method-card">
        <h3>💰 Premium Calculation</h3>
        <p>Final premium combines expected loss with actuarial loadings for admin, profit margin, and adverse selection risk.</p>
        <div class="formula">E[L] = λ × E[X']<br/>Premium = E[L] × (1 + θ)<br/><span class="c">// θ = loading factor (15–35%)</span></div>
        <p style="font-size:14px;color:var(--muted);">Example: 2 interruptions/yr × KSh 15,000 severity × 1.20 loading = <strong>KSh 36,000/yr</strong></p>
      </div>
      <div class="method-card">
        <h3>🛡️ Moral Hazard Controls</h3>
        <p>Multiple mechanisms prevent fraud and reduce moral hazard, keeping premiums fair for the entire pool.</p>
        <div class="formula">Waiting period: 7–30 days<br/>Deductible: 10–20% co-pay<br/>Payouts tied to: views + engagement<br/><span class="c">// platform API verification</span></div>
        <p style="font-size:14px;color:var(--muted);">Claims require platform logs, illness certificates, and engagement data verified through INSUTOK app API integrations.</p>
      </div>
    </div>
  </div>
  </section>

<script>
// ══════════════════════════════════════════════════════
// SUPABASE CONFIG
// ── SETUP INSTRUCTIONS ──────────────────────────────
// 1. Go to https://supabase.com → Create free account
// 2. New Project → name it "insutok"
// 3. Go to Settings → API → copy your URL and anon key below
// 4. Go to SQL Editor → run this SQL to create the profiles table:
//
//    create table profiles (
//      id uuid references auth.users on delete cascade primary key,
//      full_name text, id_number text, tax_pin text,
//      biz_reg text, location text, phone text,
//      platform text, handle text, niche text,
//      monthly_income numeric, plan text, bans_history text,
//      risk_score numeric, policy_number text,
//      created_at timestamptz default now()
//    );
//    alter table profiles enable row level security;
//    create policy "Users own their profile"
//      on profiles for all using (auth.uid() = id);
//
// 5. Replace the two values below with your real keys:
// ────────────────────────────────────────────────────
const SUPABASE_URL  = 'https://xoclnztwahmmyvxsyedq.supabase.co';
const SUPABASE_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhvY2xuenR3YWhtbXl2eHN5ZWRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MzMwMDQsImV4cCI6MjA5NjQwOTAwNH0.tCvHqIYxttSj3QjpePqrKYq8daSF0-IGJtGrKUv3VZ8';
// ══════════════════════════════════════════════════════

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentProfile = null;

// ─── AUTH: INIT ── check if already logged in ───
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (session?.user) {
    currentUser = session.user;
    await onLoggedIn(currentUser);
  } else {
    showAuthScreen();
  }
  db.auth.onAuthStateChange(async (_event, session) => {
    if (session?.user) {
      currentUser = session.user;
      await onLoggedIn(currentUser);
    }
  });
})();

function showAuthScreen() {
  document.getElementById('auth-screen').style.display = 'flex';
}

async function onLoggedIn(user) {
  document.getElementById('auth-screen').style.display = 'none';
  // Update nav
  const name = user.user_metadata?.full_name || user.email.split('@')[0];
  const initials = name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('nav-login-btn').style.display = 'none';
  document.getElementById('nav-user-wrap').style.display = 'flex';
  document.getElementById('nav-avatar').textContent = initials;
  document.getElementById('nav-user-name').textContent = name.split(' ')[0];
  // Load profile from DB
  await loadProfile(user.id);
}

// ─── AUTH TABS ───
function switchAuthTab(tab) {
  document.getElementById('auth-form-login').style.display    = tab==='login'    ? '' : 'none';
  document.getElementById('auth-form-register').style.display = tab==='register' ? '' : 'none';
  document.getElementById('auth-tab-login').classList.toggle('active', tab==='login');
  document.getElementById('auth-tab-register').classList.toggle('active', tab==='register');
  clearAuthMessages();
}

function showAuthError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg; el.style.display = 'block';
  el.parentElement.classList.add('shake');
  setTimeout(()=>el.parentElement.classList.remove('shake'),400);
  document.getElementById('auth-success').style.display = 'none';
}
function showAuthSuccess(msg) {
  const el = document.getElementById('auth-success');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('auth-error').style.display = 'none';
}
function clearAuthMessages() {
  document.getElementById('auth-error').style.display = 'none';
  document.getElementById('auth-success').style.display = 'none';
}

// ─── REGISTER ───
async function handleRegister() {
  const name  = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pw    = document.getElementById('reg-pw').value;
  const pw2   = document.getElementById('reg-pw2').value;
  clearAuthMessages();
  if (!name || !email || !pw)        { showAuthError('Please fill in all fields.'); return; }
  if (pw.length < 8)                 { showAuthError('Password must be at least 8 characters.'); return; }
  if (pw !== pw2)                    { showAuthError('Passwords do not match.'); return; }

  const btn = document.getElementById('register-btn');
  btn.disabled = true; btn.textContent = 'Creating account...';

  const { data, error } = await db.auth.signUp({
    email, password: pw,
    options: { data: { full_name: name } }
  });

  btn.disabled = false; btn.textContent = 'Create My Account →';
  if (error) { showAuthError(error.message); return; }

  // Create blank profile row
  if (data.user) {
    const policyNum = 'INS-' + Date.now().toString().slice(-7);
    await db.from('profiles').upsert({
      id: data.user.id,
      full_name: name,
      policy_number: policyNum
    });
  }
  showAuthSuccess('✅ Account created! Check your email to confirm, then log in.');
}

// ─── LOGIN ───
async function handleLogin() {
  const email = document.getElementById('login-email').value.trim();

// ─── NUMBERS ───
function fmtNum(n){return Math.round(n).toLocaleString('en-KE');}

// ─── MATH & CHARTS HELPERS ───
function factorial(n) {
  if (n === 0 || n === 1) return 1;
  let result = 1;
  for (let i = n; i >= 1; i--) { result *= i; }
  return result;
}

function generatePoissonData(lambda) {
  let labels = [], data = [];
  for (let k = 0; k <= 8; k++) {
    labels.push(k + (k === 8 ? '+' : ''));
    let p = (Math.pow(lambda, k) * Math.exp(-lambda)) / factorial(k);
    data.push((p * 100).toFixed(1)); 
  }
  return { labels, data };
}

function generateLognormalData(expectedSeverity) {
  let labels = [], data = [];
  const sigma = 0.7;
  const mu = Math.log(expectedSeverity) - (Math.pow(sigma, 2) / 2);
  const step = expectedSeverity * 0.2;
  
  for (let x = expectedSeverity * 0.1; x <= expectedSeverity * 3.5; x += step) {
    labels.push('KSh ' + (Math.round(x/1000)*1000).toLocaleString()); 
    const coeff = 1 / (x * sigma * Math.sqrt(2 * Math.PI));
    const expTerm = Math.exp(-Math.pow(Math.log(x) - mu, 2) / (2 * Math.pow(sigma, 2)));
    data.push((coeff * expTerm * expectedSeverity * 100).toFixed(2)); 
  }
  return { labels, data };
}

// ─── RISK PROFILER LOGIC ───
// Weights from notes: Platform 10%, Niche 40%, Bans 50%
// Ranges: 1.00–1.60 = High Risk, 1.61–2.30 = Medium, 2.31–3.00 = Low
const W = {platform: 0.10, niche: 0.40, bans: 0.50};

function selectRiskOpt(btn, groupId) {
  document.querySelectorAll(`#${groupId} .ropt`).forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  calcRiskScore();
}

function getRiskVal(groupId) {
  const sel = document.querySelector(`#${groupId} .ropt.selected`);
  return sel ? +sel.dataset.val : 3;
}

function calcRiskScore() {
  const vPlatform = getRiskVal('rp-platform');
  const vNiche    = getRiskVal('rp-niche');
  const vBans     = getRiskVal('rp-bans');

  // Weighted score — higher raw score = higher risk = LOWER weighted score after inversion
  // Notes say: score 1.00–1.60 = High risk, 2.31–3.00 = Low risk
  // So we map: raw scores 1–5 to weighted score
  // Using: weighted = (platform×0.1 + niche×0.4 + bans×0.5) — same as notes
  // But the notes show higher score = higher risk, and range 1–3 after weighting.
  // The min raw is 1 (best) and max is 5 (worst)
  // Min weighted = 1×0.1 + 1×0.4 + 1×0.5 = 1.0 (low risk end)
  // Max weighted = 5×0.1 + 5×0.4 + 5×0.5 = 5.0 (high risk end)
  // But notes say range is 1.00–3.00. So we scale: score = raw_weighted / (5/3) mapped to 1–3
  // Actually from the notes: min=100 max=300 after multiplication of scores and weights
  // Let's use the exact notes formula: each factor score × weight, sum them. Range is 1.0–3.0.
  // Wait — notes say "minimum score is 1.00 and maximum is 3.00 after multiplication of scores and weights"
  // With weights 0.5,0.4,0.1 and scores 1–5: min = 1×0.5+1×0.4+1×0.1=1.0, max = 5×0.5+5×0.4+5×0.1=5.0
  // But notes say max is 3.00. So they likely mean scores 1–3 per factor (not 1,3,5).
  // The options say Score: 5, 3, 1 — but they're mapped internally. Let me re-read.
  // Notes: "more ≥3 is given score of 5, (1-2) bans = score of 3, zero bans = 1"
  // So scores ARE 1,3,5 for each factor. But "minimum 1.00 max 3.00".
  // With scores 1,3,5 and weights 0.1,0.4,0.5: min=1×1=1.0, max=5×1=5.0 still.
  // UNLESS the range note means 1.00–3.00 is after normalizing: score/5 × 3 → maps 1→0.6, 3→1.8, 5→3.0
  // Let's use: finalScore = (w_bans × vBans + w_niche × vNiche + w_platform × vPlatform) / 5 × 3
  // That gives range: min=1×1/5×3=0.6, max=5×1/5×3=3.0 — close enough
  // Actually simplest: just use weighted sum directly (it'll be between 1.0 and 5.0)
  // Then classify: 1.00–2.33=High, 2.34–3.67=Medium, 3.68–5.00=Low
  // But NOTES say ranges 1.00–1.60, 1.61–2.30, 2.31–3.00 — scores of 1,3,5 but weighted to 0.1,0.4,0.5
  // If raw scores were 1–3 (i.e. choices map to 1,2,3 not 1,3,5), THEN:
  // min=1×1=1.0, max=3×1=3.0 — matches the notes exactly!
  // So: option "5" in HTML = actual score 1 (best), "3"=2 (mid), "1"=3 (worst) — inverted for display
  // Let me re-map: val 5→1, val 3→2, val 1→3 (since 5 = many bans = score 5 in display but 3 in weighted)
  const remap = v => v === 5 ? 3 : v === 3 ? 2 : 1; // display score → actual 1-3 factor score
  const sP = remap(vPlatform);
  const sN = remap(vNiche);
  const sB = remap(vBans);

  const weighted = (sB * W.bans) + (sN * W.niche) + (sP * W.platform);
  const score = Math.round(weighted * 100) / 100;

  // Classification per notes: 1.00–1.60 High, 1.61–2.30 Medium, 2.31–3.00 Low
  let cls, clsColor, desc, plan, price, loadVal;
  if (score >= 2.31) {
    cls='Low Risk'; clsColor='#10b981'; 
    desc='Your platforms and content history suggest low interruption risk. You qualify for our best rates.';
    plan='Bronze Starter'; price='From KSh 18,000/yr'; loadVal='0.15';
  } else if (score >= 1.61) {
    cls='Medium Risk'; clsColor='#f59e0b';
    desc='Moderate interruption risk. A balanced plan with good coverage is recommended.';
    plan='Silver Growth'; price='From KSh 27,000/yr'; loadVal='0.20';
  } else {
    cls='High Risk'; clsColor='#ef4444';
    desc='Higher interruption likelihood based on your profile. Comprehensive cover recommended.';
    plan='Gold Professional'; price='From KSh 36,000/yr'; loadVal='0.35';
  }

  // Update UI
  document.getElementById('rrp-score').textContent = score.toFixed(2);
  document.getElementById('rrp-score').style.background = `linear-gradient(135deg, ${clsColor}, #f59e0b)`;
  document.getElementById('rrp-score').style.webkitBackgroundClip = 'text';
  document.getElementById('rrp-score').style.backgroundClip = 'text';
  document.getElementById('rrp-score').style.webkitTextFillColor = 'transparent';

  // Bar marker: score 1.00=0%, 3.00=100%
  const pct = ((score - 1) / 2) * 100;
  document.getElementById('rrp-bar-marker').style.left = pct + '%';

  document.getElementById('rrp-classification').textContent = cls;
  document.getElementById('rrp-classification').style.color = clsColor;
  document.getElementById('rrp-desc').textContent = desc;

  document.getElementById('rrp-m-platform').textContent = `${sP} × 0.10 = ${(sP*0.1).toFixed(2)}`;
  document.getElementById('rrp-m-niche').textContent    = `${sN} × 0.40 = ${(sN*0.4).toFixed(2)}`;
  document.getElementById('rrp-m-bans').textContent     = `${sB} × 0.50 = ${(sB*0.5).toFixed(2)}`;
  document.getElementById('rrp-m-total').textContent    = score.toFixed(2) + ` (${cls})`;

  document.getElementById('rrp-rec-plan').textContent  = plan;
  document.getElementById('rrp-rec-price').textContent = price;

  // Store for apply button
  document.getElementById('risk-result-panel').dataset.loadVal = loadVal;
}

// ─── API CONNECT SIMULATION ───
const connectedAPIs = {};
function simulateAPIConnect(platform) {
  if (connectedAPIs[platform]) {
    toast(`${platform} already connected ✅`, '🔗'); return;
  }
  toast(`Connecting to ${platform}... (demo mode)`, '⏳', 2000);
  setTimeout(() => {
    connectedAPIs[platform] = true;
    const key = platform.toLowerCase();
    const btn = document.querySelector(`.api-btn.${key}`);
    if (!btn) return;
    btn.classList.add('connected');
    document.getElementById(`api-status-${key}`).textContent = '✓ Connected';
    toast(`${platform} connected! Income data verified.`, '✅');
  }, 1800);
}

// ─── DOWNLOAD PDF REPORT LOGIC (BULLETPROOF FIX) ───
function downloadReport() {
  toast('Compiling your report...', '⏳', 3000);
  
  // 1. Force the UI to show the charts so they render properly
  if (!document.getElementById('tab-analytics').classList.contains('active')) {
    switchTab(null, 'tab-analytics');
  }
  updateCharts();

  // Give the browser 600ms to render the new chart sizes perfectly
  setTimeout(() => {
    // Populate the template data
    const d = new Date();
    document.getElementById('rep-date').textContent = d.toLocaleDateString('en-KE') + ' ' + d.toLocaleTimeString('en-KE');
    document.getElementById('rep-ref').textContent = 'REQ-' + Date.now().toString().slice(-6);

    document.getElementById('rep-income').textContent = document.getElementById('income-val').textContent;
    document.getElementById('rep-freq').textContent = document.getElementById('freq-val').textContent;
    document.getElementById('rep-days').textContent = document.getElementById('days-val').textContent;
    document.getElementById('rep-ratio').textContent = document.getElementById('ratio-val').textContent;
    
    const riskSelect = document.getElementById('risk-cat');
    document.getElementById('rep-load').textContent = riskSelect.options[riskSelect.selectedIndex].text;
    const waitSelect = document.getElementById('wait-period');
    document.getElementById('rep-wait').textContent = waitSelect.options[waitSelect.selectedIndex].text;

    document.getElementById('rep-out-daily').textContent = document.getElementById('br-daily').textContent;
    document.getElementById('rep-out-sev').textContent = document.getElementById('br-severity').textContent;
    document.getElementById('rep-out-eloss').textContent = document.getElementById('br-eloss').textContent;
    document.getElementById('rep-out-premium').textContent = document.getElementById('annual-premium').textContent;

    // Change chart backgrounds to white for the image capture, disable animation
    poissonChartInstance.options.plugins.customCanvasBackgroundColor.color = '#ffffff';
    Chart.defaults.color = '#333'; 
    poissonChartInstance.update('none');
    
    lognormalChartInstance.options.plugins.customCanvasBackgroundColor.color = '#ffffff';
    lognormalChartInstance.update('none');

    // Extract the chart canvases as base64 images
    const pChart = document.getElementById('poissonChart');
    const lChart = document.getElementById('lognormalChart');
    document.getElementById('rep-img-poisson').src = pChart.toDataURL('image/png', 1.0);
    document.getElementById('rep-img-lognormal').src = lChart.toDataURL('image/png', 1.0);

    // Revert the main UI charts back to dark theme
    poissonChartInstance.options.plugins.customCanvasBackgroundColor.color = '#13161e';
    Chart.defaults.color = '#6e7899';
    poissonChartInstance.update('none');
    lognormalChartInstance.options.plugins.customCanvasBackgroundColor.color = '#13161e';
    lognormalChartInstance.update('none');

    // Setup the absolute bulletproof wrapper to prevent "half-page" scrolling bugs
    const element = document.getElementById('pdf-report-container');
    const originalParent = element.parentNode;
    
    const wrapper = document.createElement('div');
    wrapper.style.position = 'absolute';
    wrapper.style.top = '0';
    wrapper.style.left = '0';
    wrapper.style.zIndex = '-9999'; // Render completely underneath the actual website
    
    // Inject the template into the top-level wrapper
    wrapper.appendChild(element);
    document.body.appendChild(wrapper);
    element.style.display = 'block';

    const opt = {
      margin:       0.3,
      filename:     'INSUTOK_Risk_Report.pdf',
      image:        { type: 'jpeg', quality: 1 },
      // scrollY: 0 forces html2canvas to look at the absolute top of the document
      html2canvas:  { scale: 2, useCORS: true, logging: false, scrollY: 0, windowY: 0 },
      jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
    };

    // Generate PDF and then instantly clean up the DOM
    html2pdf().set(opt).from(element).save().then(() => {
      element.style.display = 'none';
      originalParent.appendChild(element);
      document.body.removeChild(wrapper);
      toast('Report downloaded successfully!', '✅');
    });

  }, 600); 
}

// ─── MODAL ───
function openModal(plan=''){
  if(plan && document.getElementById('wl-plan')){
    const sel = document.getElementById('wl-plan');
    for(let i=0;i<sel.options.length;i++){
      if(sel.options[i].text.startsWith(plan)){sel.selectedIndex=i;break;}
    }
  }
  document.getElementById('modal').classList.add('open');
  document.getElementById('modal-form').style.display='';
  document.getElementById('modal-success').style.display='none';
}
function openWaitlistFromCalc(){
  const premium = document.getElementById('annual-premium').textContent;
  openModal();
  toast(`Quote loaded: ${premium} — Complete the form to save it!`, '📋', 5000);
}
function closeModal(){document.getElementById('modal').classList.remove('open');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal();});

// ─── SUBMISSIONS ───
async function submitWaitlist(){
  const name     = document.getElementById('wl-name').value.trim();
  const email    = document.getElementById('wl-email').value.trim();
  const phone    = document.getElementById('wl-phone').value.trim();
  const platform = document.getElementById('wl-platform').value;
  const plan     = document.getElementById('wl-plan').value;

  if(!name||!email){toast('Please fill in name and email.','⚠️');return;}

  try{
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_WAITLIST_TEMPLATE, {
      to_name: name, to_email: email, phone, platform, plan, reply_to: email,
      message: `New waitlist signup!\nName: ${name}\nEmail: ${email}\nPhone: ${phone}\nPlatform: ${platform}\nPlan: ${plan}`
    });
    document.getElementById('modal-form').style.display='none';
    document.getElementById('modal-success').style.display='';
    const waMsg = encodeURIComponent(`Hi ${name}! 🎉 You've successfully joined the INSUTOK waitlist! We'll notify you when we launch. Selected plan: ${plan||'Not decided yet'}. Questions? Just reply here!`);
    if(phone) setTimeout(()=>window.open(`https://wa.me/${phone.replace(/\D/g,'')}?text=${waMsg}`, '_blank'), 1500);
  }catch(err){
    document.getElementById('modal-form').style.display='none';
    document.getElementById('modal-success').style.display='';
    toast('You\'re on the waitlist! (Email service setup needed for confirmation emails)', '🎉', 6000);
  }
}

async function submitClaim(){
  const name    = document.getElementById('c-name').value.trim();
  const email   = document.getElementById('c-email').value.trim();
  const phone   = document.getElementById('c-phone').value.trim();
  const idno    = document.getElementById('c-idno').value.trim();
  const taxpin  = document.getElementById('c-taxpin').value.trim();
  const platform= document.getElementById('c-platform').value;
  const type    = document.getElementById('c-type').value;
  const start   = document.getElementById('c-start').value;
  const desc    = document.getElementById('c-desc').value.trim();

  // Legal checkbox validation
  const legalInsurance = document.getElementById('legal-insurance').checked;
  const legalData      = document.getElementById('legal-data').checked;
  const legalScan      = document.getElementById('legal-scan').checked;
  const legalPublic    = document.getElementById('legal-public').checked;

  if(!name||!email||!phone||!idno||!taxpin||!platform||!type||!start||!desc){
    toast('Please fill all required fields (marked *).','⚠️'); return;
  }
  if(!legalInsurance||!legalData||!legalScan||!legalPublic){
    toast('Please accept all legal disclosures to proceed.','⚠️'); return;
  }

  const ref = 'INS-' + Date.now().toString().slice(-7);

  // Build detailed claim message
  const niche   = document.getElementById('c-niche').value;
  const handle1 = document.getElementById('c-handle1').value;
  const brands  = document.getElementById('c-brands').value;
  const campVal = document.getElementById('c-campaign-val').value;
  const bans    = document.getElementById('c-bans-history').value;
  const connectedStr = Object.keys(connectedAPIs).length > 0 ? Object.keys(connectedAPIs).join(', ') : 'None';

  const claimMsg = `INSUTOK CLAIM SUBMISSION\n\nRef: ${ref}\n\n--- KYC ---\nName: ${name}\nEmail: ${email}\nPhone: ${phone}\nID No: ${idno}\nTax PIN: ${taxpin}\nLocation: ${document.getElementById('c-location').value}\n\n--- DIGITAL ASSETS ---\nPlatform: ${platform}\nHandle: ${handle1}\nNiche: ${niche}\nConnected APIs: ${connectedStr}\n\n--- CLAIM ---\nType: ${type}\nStart Date: ${start}\nBrands: ${brands}\nCampaign Value: KSh ${campVal}\nBan History: ${bans}\n\n--- DESCRIPTION ---\n${desc}`;

  try{
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_CLAIM_TEMPLATE, {
      to_email: email, to_name: name, ref, phone, platform, type, start,
      end: document.getElementById('c-end').value,
      subject: `New INSUTOK Claim — ${ref}`,
      message: claimMsg, reply_to: email
    });
  }catch(e){}

  document.getElementById('claim-form-body').style.display='none';
  document.getElementById('claim-ref').textContent = ref;
  document.getElementById('claim-success').style.display='';

  const waMsg = encodeURIComponent(`Hi ${name}! ✅ Your INSUTOK claim has been received.\n\n📋 Reference: *${ref}*\nType: ${type}\nPlatform: ${platform}\n\nWe'll review within 48 hours and update you here. Stay tuned!`);
  setTimeout(()=>window.open(`https://wa.me/${phone.replace(/\D/g,'')}?text=${waMsg}`, '_blank'), 800);
}

function resetClaimForm(){
  document.getElementById('claim-form-body').style.display='';
  document.getElementById('claim-success').style.display='none';
  document.querySelectorAll('#claim-form-body input,#claim-form-body select,#claim-form-body textarea').forEach(el=>el.value='');
  document.querySelectorAll('.legal-cb').forEach(cb=>cb.checked=false);
  Object.keys(connectedAPIs).forEach(k=>{
    delete connectedAPIs[k];
    const btn = document.querySelector(`.api-btn.${k.toLowerCase()}`);
    if(btn){btn.classList.remove('connected');document.getElementById(`api-status-${k.toLowerCase()}`).textContent='Not connected';}
  });
}

// ─── SCROLL ANIMATIONS ───
const obs = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      e.target.classList.add('visible');
      const nums = e.target.querySelectorAll('[data-target]');
      nums.forEach(n=>animCount(n));
    }
  });
},{threshold:0.12});
document.querySelectorAll('.fade-in').forEach(el=>obs.observe(el));

function animCount(el){
  if(el.classList.contains('counted')) return;
  el.classList.add('counted');
  const target = +el.dataset.target;
  const isDecimal = el.dataset.decimal === '1';
  let current = 0; const steps = 60; const inc = target / steps;
  const interval = setInterval(()=>{
    current = Math.min(current + inc, target);
    el.textContent = isDecimal ? current.toFixed(1) : Math.round(current).toLocaleString('en-KE');
    if(current >= target) clearInterval(interval);
  }, 1600/steps);
}
